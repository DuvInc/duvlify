# Every URL below points at the upstream project. Running your own
# documentation on this framework? Repoint them at your repository, or delete
# this folder. Otherwise anyone filing an issue on your repository is handed a
# link to somebody else's Discussions and somebody else's security advisories.
blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/DuvInc/duvlify/discussions
    about: Anything that is not a bug report or a concrete feature request.
  - name: Security issue
    url: https://github.com/DuvInc/duvlify/security/advisories/new
    about: Please report privately rather than in a public issue.
